[project]
name = "aiochainscan"
version = "0.6.0"
description = "Async Python client for Etherscan-compatible and Blockscout APIs"
authors = [
    { name = "VaitaR", email = "andrey.shivalin@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "httpx>=0.27.0",
    "aiolimiter>=1.1.0",
    "tenacity>=8.2.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.1.2",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "pre-commit>=3.5.0",
    "coveralls>=3.3.1",
    "ruff==0.4.7",
    "mypy",
    "import-linter>=2.0.0",
    "eth-abi",
    "eth-utils>=2.0.0",
    "eth-hash[pycryptodome]",
]
# Pure-Python keccak/ABI-decode fallback when the fastabi Rust extension is absent
fallback = [
    "eth-abi",
    "eth-utils>=2.0.0",
]
# Enables http2=True on Network/clients (off by default: Cloudflare WAF GOAWAY risk)
http2 = [
    "httpx[http2]>=0.27.0",
]
mcp = [
    "mcp>=1.0.0",
]
data = [
    "polars>=1.0.0",
]

[project.scripts]
aiochainscan = "aiochainscan.cli:main"

[project.urls]
Homepage = "https://github.com/VaitaR/aiochainscan"
Repository = "https://github.com/VaitaR/aiochainscan"
Issues = "https://github.com/VaitaR/aiochainscan/issues"

[build-system]
requires = ["maturin>=1.8,<2.0"]  # >=1.8 required for ZIP64 support
build-backend = "maturin"

[tool.maturin]
# Build the fastabi Rust extension
module-name = "aiochainscan.aiochainscan_fastabi"
manifest-path = "aiochainscan/fastabi/Cargo.toml"
python-source = "."
features = ["pyo3/extension-module"]
strip = true  # Strip debug symbols from the binary to reduce wheel size

[tool.pytest.ini_options]
pythonpath = [
    "."
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-m",
  "not benchmark and not slow",
]
markers = [
    "benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"')",
    "slow: marks tests as slow (e.g. E2E tests, deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring network access",
  "memory: marks tests as memory-focused benchmarks",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "SIM", "UP", "N", "C4"]
ignore = [
    "E501",  # Line too long (will be handled by formatter)
]

[tool.ruff.format]
quote-style = "single"

[tool.coverage.run]
relative_files = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
files = ["aiochainscan"]
plugins = []

[tool.importlinter]
root_package = "aiochainscan"

[[tool.importlinter.contracts]]
name = "Services do not import adapters"
type = "forbidden"
source_modules = [
  "aiochainscan.services",
]
forbidden_modules = [
  "aiochainscan.adapters",
]

[[tool.importlinter.contracts]]
name = "Adapters do not import services"
type = "forbidden"
source_modules = [
  "aiochainscan.adapters",
]
forbidden_modules = [
  "aiochainscan.services",
  "aiochainscan.domain",
]

[[tool.importlinter.contracts]]
name = "Domain isolated from infra"
type = "forbidden"
source_modules = [
  "aiochainscan.domain",
]
forbidden_modules = [
  "aiochainscan.adapters",
  "aiochainscan.services",
]

[[tool.importlinter.contracts]]
name = "Ports do not import adapters"
type = "forbidden"
source_modules = [
  "aiochainscan.ports",
]
forbidden_modules = [
  "aiochainscan.adapters",
]

[[tool.importlinter.contracts]]
name = "Services do not import core or network"
type = "forbidden"
source_modules = [
  "aiochainscan.services",
]
forbidden_modules = [
  "aiochainscan.core",
  "aiochainscan.network",
]

[[tool.importlinter.contracts]]
name = "Services do not import scanners"
type = "forbidden"
source_modules = [
  "aiochainscan.services",
]
forbidden_modules = [
  "aiochainscan.scanners",
]

[[tool.mypy.overrides]]
module = [
 "aiochainscan.network",
 "aiochainscan.config",
 "aiochainscan.decode",
 "aiochainscan.scanners.*",
]
ignore_errors = false

[[tool.mypy.overrides]]
module = [
  "aiochainscan.aiochainscan_fastabi",
  "aiochainscan_fastabi",
  "eth_abi.*",
  "eth_utils",
  "eth_utils.*",
]
ignore_missing_imports = true

# Per-module overrides for optional dependencies
# These packages are installed via extras: aiochainscan[data,mcp] / [fallback]

[[tool.mypy.overrides]]
module = ["polars", "polars.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rich", "rich.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "mcp.server.*", "mcp.server.fastmcp"]
ignore_missing_imports = true

# Ignore untyped decorators in MCP server wiring when the mcp package is missing
[[tool.mypy.overrides]]
module = ["aiochainscan.mcp_server", "aiochainscan.mcp.server"]
disable_error_code = ["misc"]
