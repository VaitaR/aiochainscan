[project]
name = "aiochainscan-fastabi"
version = "1.0.0"
description = "Rust-accelerated ABI decoding for aiochainscan (optional extra)"
authors = [
    { name = "VaitaR", email = "andrey.shivalin@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/VaitaR/aiochainscan"
Repository = "https://github.com/VaitaR/aiochainscan"

[build-system]
requires = ["maturin>=1.8,<2.0"]  # >=1.8 required for ZIP64 support
build-backend = "maturin"

[tool.maturin]
# Top-level module: a separate distribution cannot install into another
# distribution's package namespace (was aiochainscan.aiochainscan_fastabi).
module-name = "aiochainscan_fastabi"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
strip = true  # Strip debug symbols from the binary to reduce wheel size
