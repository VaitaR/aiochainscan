[package]
name = "aiochainscan_fastabi"
version = "1.0.1"
edition = "2021"

[lib]
name = "aiochainscan_fastabi"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pythonize = "0.22"
ethers = { version = "2.0", features = ["abigen"] }
hex = "0.4"
thiserror = "1.0"
twox-hash = "1.6"
dashmap = "6"
mini-moka = "0.10"
# Optional: zero-copy Arrow output for decode_many_to_arrow(). Off by default —
# benchmarked (docs/V1_PLAN.md Track A) as a small win (~2x on a 150k-row batch,
# ~0.17s absolute) next to the network time (~0.5-1.3s per single explorer page)
# that dominates any real pagination workload. Enable with `--features arrow`.
arrow = { version = "53", default-features = false, features = ["ffi"], optional = true }
pyo3-arrow = { version = "0.5", optional = true }

[features]
default = []
arrow = ["dep:arrow", "dep:pyo3-arrow"]

[build-dependencies]
pyo3-build-config = "0.22"

[profile.release]
lto = "fat"                    # Link Time Optimization
codegen-units = 1             # Better optimization
# panic = "abort" removed deliberately: pyo3 converts an unwinding panic into
# a catchable PanicException, while abort turns a panic on external data (ABI
# JSON, calldata) into an uncatchable process death (exit 134). decode.py also
# refuses extensions older than 1.0.1 for exactly this reason.
opt-level = 3                 # Maximum optimization
strip = true                  # Strip symbols
