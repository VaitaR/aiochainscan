name: Feature request
description: Propose a change to the library's behaviour or surface
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: |
        The API you have in mind. Note whether it changes existing behaviour —
        the public surface is `ChainscanClient` and the module-level helpers.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
