name: Build and Publish Wheels

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger
    inputs:
      publish:
        description: 'Publish to PyPI via trusted publishing'
        type: boolean
        default: false
      artifact_run_id:
        description: 'Publish distributions built by this run ID (completion mode; empty = this run)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # aiochainscan (base): pure Python, universal wheel + sdist, no Rust toolchain needed.
  build_pure_python:
    name: Build pure-Python aiochainscan (wheel + sdist)
    if: github.event_name == 'release'  # dispatch runs publish existing artifacts instead
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: pipx run build

      - name: Smoke test — import with no Rust toolchain on PATH
        run: |
          python -m venv /tmp/aiochainscan-smoke
          /tmp/aiochainscan-smoke/bin/pip install dist/*.whl
          /tmp/aiochainscan-smoke/bin/python -c "
          import aiochainscan
          from aiochainscan import ChainscanClient
          from aiochainscan.decode import FASTABI_AVAILABLE
          assert not FASTABI_AVAILABLE, 'base wheel must not bundle the accelerator'
          print('pure-Python base import OK, FASTABI_AVAILABLE =', FASTABI_AVAILABLE)
          "

      - name: Upload aiochainscan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aiochainscan-dist
          path: dist/*

  # aiochainscan-fastabi (optional accelerator): native wheels per platform, built by
  # maturin from aiochainscan/fastabi/ — a separate distribution, top-level module name.
  build_fastabi_wheels:
    name: Build fastabi wheels on ${{ matrix.os }}
    if: github.event_name == 'release'  # dispatch runs publish existing artifacts instead
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]  # macos-14 = Apple Silicon

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2
        with:
          package-dir: aiochainscan/fastabi
        env:
          # Build for Python 3.12, 3.13 only (requires-python >= 3.12)
          CIBW_BUILD: "cp312-* cp313-*"
          CIBW_SKIP: "pp* *-musllinux*"  # Skip PyPy and musllinux

          # Rust inside the manylinux container: rustup-init needs
          # libatomic.so.1, which some base images lack preinstalled.
          # The package manager name differs across manylinux generations.
          CIBW_BEFORE_ALL_LINUX: >
            (yum install -y libatomic || dnf install -y libatomic || microdnf install -y libatomic) &&
            curl https://sh.rustup.rs -sSf | sh -s -- -y &&
            export PATH="$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'

          # maturin (the build backend) is installed by build isolation.
          # The old CIBW_BEFORE_BUILD "pip install maturin" worked around a
          # pip ZIP64 bug and broke on Windows, where bare `pip` is not on PATH.

          # Test the native extension itself (top-level module, no aiochainscan needed)
          CIBW_TEST_COMMAND: >-
            python -c "import json; from aiochainscan_fastabi import decode_one;
            result = json.loads(decode_one(b'', '[]'));
            assert result == {'function_name': '', 'decoded_data': {}};
            print('Native fastabi smoke test passed')"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: fastabi-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_fastabi_sdist:
    name: Build fastabi source distribution
    if: github.event_name == 'release'  # dispatch runs publish existing artifacts instead
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist --outdir dist aiochainscan/fastabi

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: fastabi-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_pure_python, build_fastabi_wheels, build_fastabi_sdist]
    runs-on: ubuntu-latest
    # Releases publish normally. A dispatch with publish=true re-publishes a
    # previous run's artifacts — the completion mode used to finish v1.0.0
    # after a partial upload (PyPI filenames are immutable, so only the files
    # still missing are uploaded).
    # NOTE: a result function (always/success) must appear in this condition —
    # on a dispatch the build jobs are skipped, and a job whose `needs` are
    # skipped is itself skipped implicitly unless its condition references
    # job results. Releases additionally require every build to have passed.
    if: >-
      always() &&
      (github.event_name == 'release' ||
       github.event.inputs.publish == 'true' ||
       inputs.publish == true) &&
      (github.event_name == 'workflow_dispatch' || success())
    permissions:
      id-token: write  # For trusted publishing
      actions: read    # Download artifacts from another run in completion mode
      contents: read

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          # Completion mode reads the named run's artifacts (e.g. the original
          # v1.0.0 tag build); releases and no-op dispatches read this run's.
          run-id: ${{ github.event.inputs.artifact_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Two independent publish steps (base / fastabi): twine aborts the whole
      # batch on the first error, so one project's failure must not block the
      # other. Files already on PyPI are pruned before uploading — filenames
      # there are immutable, so re-publishing after a partial failure uploads
      # only what is missing and makes this job safely re-runnable.
      - name: Stage per project and drop files already on PyPI
        id: files
        run: |
          set -euo pipefail
          mkdir -p dist staging/base staging/fastabi
          find dist -maxdepth 1 -type f -name 'aiochainscan-*' -exec mv {} staging/base/ \;
          find dist -maxdepth 1 -type f -name 'aiochainscan_fastabi-*' -exec mv {} staging/fastabi/ \;

          leftovers=$(ls -1 dist | wc -l)
          if [ "$leftovers" -ne 0 ]; then
            echo "::error::unexpected files left in dist/: $(ls -1 dist)"
            exit 1
          fi

          prune() {
            project="$1"; dir="$2"
            existing=$(curl -fsS "https://pypi.org/pypi/$project/json" \
              | jq -r '[.releases[][].filename] | join("\n")' || true)
            if [ -z "$existing" ]; then
              echo "$project: not on PyPI yet — keeping all files"
              return
            fi
            for f in $existing; do
              if [ -f "$dir/$f" ]; then rm -v "$dir/$f"; fi
            done
          }
          prune aiochainscan staging/base
          prune aiochainscan-fastabi staging/fastabi

          echo "base_count=$(ls -1 staging/base | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "fastabi_count=$(ls -1 staging/fastabi | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "--- staging/base ---";    ls -l staging/base || true
          echo "--- staging/fastabi ---"; ls -l staging/fastabi || true

      - name: Publish aiochainscan
        if: steps.files.outputs.base_count != '0'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: staging/base

      - name: Publish aiochainscan-fastabi
        if: steps.files.outputs.fastabi_count != '0'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: staging/fastabi
