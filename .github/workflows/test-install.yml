name: Test Installation

on:
  push:
    branches: [main, develop, real-using-test]
  pull_request:
    branches: [main, develop]

jobs:
  test-wheel-install:
    name: Test Wheel Installation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The base distribution is pure Python (hatchling); the Rust accelerator
      # is the separate aiochainscan-fastabi distribution — no toolchain here.
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/
          python -m build --sdist --outdir dist/

      - name: Test wheel installation in clean environment
        run: |
          # Create a fresh virtual environment
          python -m venv /tmp/test-env
          source /tmp/test-env/bin/activate

          # Install the built wheel
          pip install dist/*.whl

          # Verify package can be imported
          python -c "import aiochainscan; print('✓ Package imported successfully')"

          # Verify version
          python -c "import aiochainscan; print(f'✓ Version: {aiochainscan.__version__}')"

          # Verify main modules
          python -c "from aiochainscan import ChainscanClient, Method; print('✓ Main classes imported')"

          # Verify modern public API
          python -c "from aiochainscan import ChainscanClient, Method, SmartContract, DecodedEvent, DecodedTransaction; print('✓ Modern public API imported')"

          # Verify the base install decodes without the Rust accelerator
          python -c "import aiochainscan.decode as d; assert not d.FASTABI_AVAILABLE; from aiochainscan import abi_pure; print('✓ Pure-Python decode floor importable')"

          # Verify CLI is available
          which aiochainscan
          aiochainscan --help

          deactivate

      - name: Test source distribution installation
        run: |
          # Verify the generated sdist was created correctly
          sdist=$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$sdist"
          ls -la "$sdist"
          SDIST_PATH="$sdist" python -c "
          import os
          import tarfile, sys
          sdist = os.environ['SDIST_PATH']
          with tarfile.open(sdist) as t:
              names = t.getnames()
              print(f'✓ Source distribution created: {sdist}')
              print(f'  Contains {len(names)} files')
              has_pyproject = any('pyproject.toml' in n for n in names)
              has_cargo = any('Cargo.toml' in n for n in names)
              has_rust = any('.rs' in n for n in names)
              has_license = any(n.endswith('/LICENSE') for n in names)
              print(f'  pyproject.toml present: {has_pyproject}')
              print(f'  fastabi Cargo.toml present: {has_cargo}')
              print(f'  Rust sources present: {has_rust}')
              print(f'  LICENSE present: {has_license}')
              if not (has_pyproject and has_cargo and has_rust and has_license):
                  print('✗ Source distribution is incomplete!')
                  sys.exit(1)
              print('✓ Source distribution structure is valid')
          "

          # Install the actual generated archive into a clean environment.
          # The base distribution builds with hatchling — pure Python, no Rust.
          python -m venv /tmp/test-sdist
          source /tmp/test-sdist/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "$sdist"
          python -c "import aiochainscan; print('✓ Sdist install works')"
          python -c "import aiochainscan.decode as d; assert not d.FASTABI_AVAILABLE; print('✓ Sdist is accelerator-free by design')"
          deactivate

      - name: Test editable install
        run: |
          # Test development install
          python -m venv /tmp/test-editable
          source /tmp/test-editable/bin/activate

          pip install -e .

          # Verify editable install
          python -c "import aiochainscan; print('✓ Editable install works')"

          deactivate

  test-git-install:
    name: Test Git Installation (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test direct git install
        run: |
          python -m pip install --upgrade pip

          # What a user without a PyPI release handy actually runs
          pip install "aiochainscan @ git+https://github.com/VaitaR/aiochainscan.git"

          # Verify installation
          python -c "import aiochainscan; print('✓ Git install successful')"
          python -c "from aiochainscan import *; print('✓ All imports successful')"

          # List installed files to verify Python modules are present
          pip show -f aiochainscan | grep -E '(aiochainscan/.*\.py|Location:)' | head -20

  test-dependencies:
    name: Test Dependencies (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and install
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/
          pip install dist/*.whl

      - name: Check dependencies are installed
        run: |
          set -euo pipefail
          # These are the runtime dependencies declared in pyproject.toml.
          python -c "import httpx; print('✓ httpx')"
          python -c "import aiolimiter; print('✓ aiolimiter')"
          python -c "import tenacity; print('✓ tenacity')"
          python -c "import orjson; print('✓ orjson')"

      - name: Verify package structure
        run: |
          set -euo pipefail
          python -c "
          import aiochainscan
          import os
          import sys
          pkg_path = os.path.dirname(aiochainscan.__file__)
          print(f'Package location: {pkg_path}')

          # Check for key modules
          modules = [
              'config', 'network', 'core', 'services', 'adapters', 'ports',
              'domain', 'scanners', 'utils', 'cli',
          ]
          missing = []
          for mod in modules:
              mod_path = os.path.join(pkg_path, mod + '.py')
              dir_path = os.path.join(pkg_path, mod)
              if os.path.exists(mod_path) or os.path.isdir(dir_path):
                  print(f'✓ {mod} exists')
              else:
                  print(f'✗ {mod} missing')
                  missing.append(mod)
          if missing:
              print('✗ Required package modules missing: ' + ', '.join(missing))
              sys.exit(1)
          "

  test-optional-dependencies:
    name: Test Optional Dependencies (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and install optional extras
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/
          wheel_path=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel_path"
          python -m pip install "${wheel_path}[fallback,data,mcp]"

      - name: Check optional packages
        run: |
          set -euo pipefail
          # [fallback] = native Keccak-256 (eth-hash + eth-utils); ABI decoding
          # needs no extra — aiochainscan/abi_pure.py is the always-present floor.
          python -c "import eth_utils; print('✓ fallback: eth_utils')"
          python -c "import eth_hash; print('✓ fallback: eth_hash')"
          python -c "import polars; print('✓ data: polars')"
          python -c "import mcp; print('✓ mcp: mcp')"
